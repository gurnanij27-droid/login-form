<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.html">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(90deg,skyblue,purple);
        }
        form{
            height: 80%;
            width: 30%;
            border-radius: 10px; 
            background-color: white;
        }
        .email,.password,.login{
            /* border: 1px solid black; */
            width: 80%;
            height: 20%;
            margin: auto;
            margin-top: 5%;
        }
        h1{
            height: 10%;
            margin-top: 5%;
        }
        input{
            margin-top: 5%;
            width: 100%;
            height: 50%;
        }
        p{
            margin-top: 5%;
        }
        #login{
            background:linear-gradient(90deg,skyblue,purple);
            border: none;
            border-radius: 10px;
            color: white;
        }
        .password>p{
            color: grey;
            font-style: italic;
        }
        .login>p{
            text-align: center;
        }
        a{
            text-decoration: none;
            font-style: italic;
        }

    </style>
</head>
<body>
        <form action="">
            <h1 align="center">LOGIN FORM</h1>
            <div class="email">
                <label for=""> Email or phone</label>
                <input type="email" placeholder="xyz@gmail.com">
            </div>
             <div class="password">
                <label for=""> password</label>
                <input type="password" placeholder="xyz@123">
                <p>Forgot password ?</p>
            </div>
            <div class="login">
                <input type="button" value="log in" id="login">
                <p>Not a member ? <a href="signup.html"> sign up</a></p>
            </div>
        </form>
</body>
</html>
